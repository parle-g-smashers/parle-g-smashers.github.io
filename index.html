<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parle-G Smashers</title>
<meta name="description" content="Sign up for Parle-G Smashers badminton sessions.">
<meta name="theme-color" content="#1E6B4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parle-G Smashers">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest?v=3">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<style>
  html, body { margin: 0; height: 100%; background: #1E6B4F; }
  .splash {
    min-height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
    padding: 24px; box-sizing: border-box; text-align: center;
    color: #E3F0E8; font: 400 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .splash img { width: 96px; height: 96px; border-radius: 22px; box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .splash h1 { margin: 0; color: #fff; font-size: 26px; font-weight: 700; letter-spacing: .01em; }
  #splash-msg { max-width: 300px; min-height: 2.9em; }
  #splash-msg button {
    margin-top: 12px; min-height: 44px; padding: 0 18px; border-radius: 10px;
    background: #fff; color: #1E6B4F; border: 0; font: 600 16px system-ui, -apple-system, sans-serif; cursor: pointer;
  }
</style>
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>
  <div class="splash">
    <img src="icon-192.png?v=3" alt="">
    <h1>Parle-G Smashers</h1>
    <div id="splash-msg" role="status">Loading sign-ups…</div>
  </div>
  <noscript><p style="color:#fff;text-align:center">This app needs JavaScript turned on.</p></noscript>
</body>
</html>
